<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <!-- Background Gradient: Deep luxurious dark metallic grey with subtle blue-purple undertones -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#2c2c2e" />
      <stop offset="60%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#0b0b0c" />
    </radialGradient>

    <!-- Golden Premium Gradient: For border and active glowing checkmark -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>

    <!-- Cyber Cyan Ice Gradient: Accent color that blends with our premium digital style -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#007AFF" />
    </linearGradient>

    <!-- Elegant Metallic Platinum for letter parts -->
    <linearGradient id="platGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E8E93" />
      <stop offset="50%" stop-color="#E5E5EA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Drop Shadow for layered effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS squircle mask-aligned background -->
  <rect x="2" y="2" width="176" height="176" rx="38" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Inner subtle glow rim -->
  <rect x="4" y="4" width="172" height="172" rx="36" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />

  <!-- Stylized Elegant Letter 'A' + Checkmark composition -->
  <g filter="url(#shadow)">
    <!-- Right leg of A, which seamlessly transforms into an ultra sleek gold Nike-style checkmark -->
    <path d="M 54 116 L 82 56 L 102 56 L 132 116 L 115 116 L 108 100 L 78 100 L 71 116 Z" fill="url(#platGrad)" opacity="0.9" />
    
    <!-- Horizon Cross-bar of A -->
    <rect x="79" y="86" width="28" height="6" rx="2" fill="url(#platGrad)" opacity="0.95" />

    <!-- Overlaid Ultra-glossy Glowing Golden Checkmark signifying perfect premium execution ('A' Priority) -->
    <path d="M 68 95 L 86 113 L 134 65" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)" />
          
    <path d="M 68 95 L 86 113 L 134 65" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.8" />
  </g>

  <!-- Subtle premium accent status dot in top-right corner representing cognitive active peak -->
  <circle cx="140" cy="40" r="5" fill="url(#cyanGrad)" filter="url(#neonGlow)" />
  <circle cx="140" cy="40" r="2" fill="#FFFFFF" />

</svg>
